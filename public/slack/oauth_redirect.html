<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollito Installed!</title>
  <link rel="icon" type="image/png" href="/assets/plates/pollito-nav-logo.png?v=4">
  <style>
    body {
      background: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .mascot {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 12px;
      color: #F8FAFC;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .btn {
      display: inline-block;
      background: #F59E0B;
      color: #0F172A;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 15px;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #D97706;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/plates/pollito-nav-logo.png?v=4" alt="Pollito" class="mascot">
    <h1>Pollito Installed!</h1>
    <p>Pollito is now ready in your Slack workspace. Head back to Slack and run <strong>/pollito</strong> in any channel to create your first poll.</p>
    <a href="slack://open" class="btn">Open Slack</a>
  </div>
</body>
</html>

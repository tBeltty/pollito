# Public status page for Pollito. Copy to /etc/nginx/sites-available/status.tbelt.online.conf,
# link it into sites-enabled, then run: certbot --nginx -d status.tbelt.online
server {
    server_name status.tbelt.online;
    listen 80;
    listen [::]:80;

    root /home/jhonatan/pollito/public/status;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Sanitized document written by dist/status/probe.js once a minute.
    location = /status.json {
        alias /home/jhonatan/pollito/data/status/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Only the page itself is public. Nothing else under public/ or data/ is reachable here.
    location / {
        try_files $uri $uri/ =404;
    }
}

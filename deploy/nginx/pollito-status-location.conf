# Add this block inside the existing `server { ... }` for pollito.tbelt.online in
# /etc/nginx/sites-enabled/pollito.tbelt.online.conf, then run: nginx -t && systemctl reload nginx
#
# The page itself (public/status/) is already served by the `location /` block. This only maps the
# sanitized document written by dist/status/probe.js. add_header is repeated because a location
# that defines its own headers does not inherit the ones from the server block.
location = /status/status.json {
    alias /home/jhonatan/pollito/data/status/status.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

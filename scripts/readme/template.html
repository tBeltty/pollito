<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="{{ROOT}}/public/styles.css">
<style>
  html,body{margin:0;width:1200px;height:675px;overflow:hidden;background:var(--bg-canvas)}
  .frame{width:1200px;height:675px;padding:24px;box-sizing:border-box}
  .frame .hero-visual-stage{width:100%;height:100%}
</style></head>
<body><div class="frame">
          <div class="hero-visual-stage">
            <div class="hero-art" role="img" aria-label="Pollito mascot next to a Slack poll showing 70% and 30%">
              <div class="art-card" aria-hidden="true">
                <div class="art-head"><img src="{{ROOT}}/public/assets/icons/slack.svg" alt="" width="20" height="20"><span>Poll</span></div>
                <div class="art-body">
                  <div class="art-row"><span class="art-label art-label-long"></span><span class="art-pct art-pct-a">70%</span></div>
                  <div class="art-track"><span class="art-fill art-fill-a"></span></div>
                  <div class="art-row"><span class="art-label"></span><span class="art-pct art-pct-b">30%</span></div>
                  <div class="art-track"><span class="art-fill art-fill-b"></span></div>
                  <div class="art-quorum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg><span>83% voted · quorum 75%</span></div>
                  <span class="art-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Anonymous voting</span>
                </div>
              </div>
              <picture>
                <source srcset="{{ROOT}}/public/assets/plates/mascot-pollito.webp" type="image/webp">
                <img class="art-mascot" src="{{ROOT}}/public/assets/plates/mascot-pollito.png" alt="" width="992" height="995">
              </picture>
            </div>
          </div>
</div></body></html>
